<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0c0c1e 0%, #1a1a3e 50%, #0f0f2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 900px;
            height: 500px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 
                0 0 40px rgba(102, 126, 234, 0.4),
                0 0 80px rgba(118, 75, 162, 0.3),
                inset 0 0 60px rgba(102, 126, 234, 0.1);
        }
        
        #gameCanvas {
            display: block;
            background: linear-gradient(180deg, #1a1a4e 0%, #2d2d6e 100%);
        }
        
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, rgba(15, 15, 45, 0.95), rgba(30, 30, 80, 0.9));
            backdrop-filter: blur(10px);
            z-index: 100;
            pointer-events: auto;
            transition: opacity 0.3s ease;
        }
        
        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        h1 {
            font-size: 56px;
            font-weight: 900;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
            margin-bottom: 10px;
            letter-spacing: 3px;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .subtitle {
            color: #a0a0c0;
            font-size: 18px;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .menu-title {
            font-size: 32px;
            color: #fff;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(72, 219, 251, 0.5);
        }
        
        .level-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .level-btn {
            width: 140px;
            height: 140px;
            border-radius: 20px;
            border: 3px solid transparent;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }
        
        .level-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0));
            z-index: 1;
        }
        
        .level-btn:hover {
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }
        
        .level-btn.selected {
            transform: scale(1.1);
            box-shadow: 0 0 30px currentColor;
        }
        
        .level-btn.easy {
            background: linear-gradient(135deg, #00b894, #00cec9);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4);
        }
        
        .level-btn.medium {
            background: linear-gradient(135deg, #fdcb6e, #e17055);
            box-shadow: 0 8px 25px rgba(253, 203, 110, 0.4);
        }
        
        .level-btn.hard {
            background: linear-gradient(135deg, #d63031, #6c5ce7);
            box-shadow: 0 8px 25px rgba(214, 48, 49, 0.4);
        }
        
        .level-btn span:first-child {
            font-size: 42px;
            font-weight: bold;
            color: white;
            z-index: 2;
        }
        
        .level-btn span:last-child {
            font-size: 12px;
            color: rgba(255,255,255,0.9);
            margin-top: 5px;
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        button.primary-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: auto;
        }
        
        button.primary-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
        }
        
        button.primary-btn:active {
            transform: translateY(0) scale(1);
        }
        
        .back-btn {
            background: transparent;
            color: #a0a0c0;
            border: 2px solid #a0a0c0;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            pointer-events: auto;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
            border-color: white;
        }
        
        #scoreDisplay {
            position: absolute;
            top: 25px;
            right: 30px;
            font-size: 28px;
            color: white;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
            z-index: 50;
            pointer-events: none;
        }
        
        #progressBar {
            position: absolute;
            top: 0;
            left: 0;
            height: 6px;
            background: linear-gradient(90deg, #667eea, #764ba2, #f093fb);
            z-index: 50;
            transition: width 0.1s linear;
        }
        
        .instructions {
            background: rgba(255,255,255,0.05);
            padding: 20px 40px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .instructions p {
            color: #48dbfb;
            font-size: 16px;
            line-height: 1.8;
        }
        
        .key-badge {
            display: inline-block;
            background: rgba(255,255,255,0.15);
            padding: 5px 15px;
            border-radius: 8px;
            margin: 0 5px;
            font-weight: bold;
            color: white;
        }
        
        #deathScreen {
            background: radial-gradient(circle, rgba(233, 69, 96, 0.3), rgba(15, 15, 45, 0.95));
        }
        
        #deathScreen h2 {
            font-size: 48px;
            color: #ff6b6b;
            margin-bottom: 15px;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.7);
        }
        
        #finalScore {
            font-size: 24px;
            color: #feca57;
            margin-bottom: 30px;
        }
        
        .stats-row {
            display: flex;
            gap: 40px;
            margin-bottom: 30px;
        }
        
        .stat-item {
            text-align: center;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            color: #48dbfb;
        }
        
        .stat-label {
            font-size: 14px;
            color: #a0a0c0;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="900" height="500"></canvas>
        
        <div id="uiLayer">
            <div id="progressBar" style="width: 0%"></div>
            <div id="scoreDisplay">0</div>
            
            <!-- Главное меню -->
            <div id="startScreen" class="screen">
                <h1>GEOMETRY DASH</h1>
                <p class="subtitle">Выбери свой уровень!</p>
                
                <div class="instructions">
                    <p>
                        <span class="key-badge">ПРОБЕЛ</span> или 
                        <span class="key-badge">↑</span> или 
                        <span class="key-badge">КЛИК</span> для прыжка
                    </p>
                </div>
                
                <button class="primary-btn" onclick="showLevelSelect()">Играть</button>
            </div>
            
            <!-- Выбор уровня -->
            <div id="levelSelectScreen" class="screen hidden">
                <h2 class="menu-title">ВЫБЕРИ УРОВЕНЬ</h2>
                
                <div class="level-grid">
                    <div class="level-btn easy selected" onclick="selectLevel('easy', this)">
                        <span>1</span>
                        <span>Лёгкий</span>
                    </div>
                    <div class="level-btn medium" onclick="selectLevel('medium', this)">
                        <span>2</span>
                        <span>Средний</span>
                    </div>
                    <div class="level-btn hard" onclick="selectLevel('hard', this)">
                        <span>3</span>
                        <span>Сложный</span>
                    </div>
                </div>
                
                <button class="primary-btn" onclick="startGame()">НАЧАТЬ</button>
                <button class="back-btn" onclick="showMainMenu()">← Назад</button>
            </div>
            
            <!-- Экран смерти -->
            <div id="deathScreen" class="screen hidden">
                <h2>РАЗБИТ!</h2>
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-value" id="scoreValue">0</div>
                        <div class="stat-label">Очков</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="attemptValue">1</div>
                        <div class="stat-label">Попытка</div>
                    </div>
                </div>
                <button class="primary-btn" onclick="restartLevel()">ЗАНОВО</button>
                <button class="back-btn" onclick="showMainMenu()">← В меню</button>
            </div>
            
            <!-- Экран победы -->
            <div id="winScreen" class="screen hidden">
                <h2 style="color: #00b894; text-shadow: 0 0 30px rgba(0, 184, 148, 0.7);">УРОВЕНЬ ПРОЙДЕН!</h2>
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-value" id="winScore">0</div>
                        <div class="stat-label">Очков</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="winAttempts">1</div>
                        <div class="stat-label">Попыток</div>
                    </div>
                </div>
                <button class="primary-btn" onclick="showLevelSelect()">СЛЕДУЮЩИЙ</button>
                <button class="back-btn" onclick="showMainMenu()">← В меню</button>
            </div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
